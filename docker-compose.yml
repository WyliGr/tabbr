services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabbr}
      POSTGRES_USER: ${POSTGRES_USER:-tabbr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabbr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tabbr}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/wyligr/tabbr-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tabbr}:${POSTGRES_PASSWORD:-tabbr}@db:5432/${POSTGRES_DB:-tabbr}

volumes:
  pgdata: